name: Weekly Digest

on:
  schedule:
    # Saturday 09:13 UTC (GMT)
    - cron: "13 9 * * 6"
  workflow_dispatch:

concurrency:
  group: weekly-digest-${{ github.ref }}
  cancel-in-progress: true

jobs:
  run-digest:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    env:
      NCBI_API_KEY: ${{ secrets.NCBI_API_KEY }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      BREVO_API_KEY: ${{ secrets.BREVO_API_KEY }}
      BREVO_SENDER_EMAIL: ${{ secrets.BREVO_SENDER_EMAIL }}
      BREVO_SENDER_NAME: ${{ secrets.BREVO_SENDER_NAME }}
      BREVO_LIST_ID: ${{ secrets.BREVO_LIST_ID }}
      AUTO_PROCEED: "1"
      # The full run records the estimate; avoid fetching the same PubMed data twice.
      ESTIMATE_FIRST: "0"
      SEND_EMAIL: "1"
      NO_EMAIL: "0"
      EMAIL_PROVIDER: "brevo"
      EMAIL_TO_FILE: ""
      EMAIL_BREVO_LIST_ID: ${{ secrets.BREVO_LIST_ID }}
      MAX_RESULTS: "750"
      GEMINI_MODEL: "gemini-3.5-flash"
      GEMINI_LITE_MODEL: "gemini-3.5-flash-lite"
      LLM_CORE_TOP_N: "15"
      LLM_LITE_TOP_N: "25"
      LLM_BATCH_SIZE: "1"
      LLM_LITE_BATCH_SIZE: "13"
      LLM_BATCH_DELAY_SECONDS: "30"
      LLM_MAX_REQUESTS: "20"
      LLM_MIN_SUCCESS_RATE: "0.0"
      PODCAST_SOURCE: "1"
      PODCAST_PDF: "1"

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Restore LLM Cache
        id: llm-cache-restore
        uses: actions/cache/restore@v4
        with:
          path: outputs/llm_cache.json
          key: llm-cache-${{ runner.os }}-${{ github.run_id }}
          restore-keys: |
            llm-cache-${{ runner.os }}-

      - name: Install PDF Tooling
        run: |
          sudo apt-get update
          sudo apt-get install -y pandoc texlive-xetex perl

      - name: Run Weekly Pipeline
        run: |
          set -o pipefail
          chmod +x scripts/run_weekly_digest.sh scripts/render_pdf.sh
          mkdir -p outputs
          ./scripts/run_weekly_digest.sh 2>&1 | tee outputs/workflow.log

      - name: Save LLM Cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: outputs/llm_cache.json
          key: ${{ steps.llm-cache-restore.outputs.cache-primary-key }}

      - name: Upload Outputs Artifact
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: digest-outputs-${{ github.run_id }}
          path: |
            outputs/workflow.log
            outputs/llm_cache.json
            outputs/*_digest.md
            outputs/*_digest.pdf
            outputs/*_digest.json
            outputs/*_run_summary.json
            outputs/*_core_podcast_source.md
            outputs/*_core_podcast_source.pdf
